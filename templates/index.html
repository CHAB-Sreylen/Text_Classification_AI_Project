<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Categorization</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-wrapper">
        <div class="glass-container">
            <div class="content-header">
                <h1>Document Categorization</h1>
                <p>Enter a short document below or upload a .txt file to find its category</p>
            </div>

            <div class="card-content">
                <div class="card-title">
                    <span class="brain-icon">🧠</span>
                    <h2>Document Analysis</h2>
                </div>
                <p class="card-description">Our AI will analyze your document and suggest the best category</p>

                <form action="/predict" method="POST" enctype="multipart/form-data" class="form-card">
                    <div class="form-group">
                        <label for="document">Input your document:</label>
                        <textarea 
                            id="document" 
                            name="document" 
                            placeholder="Type your document here..."
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="file">Or upload a .txt file:</label>
                        <input type="file" id="file" name="file" accept=".txt">
                    </div>

                    <div class="form-group">
                        <label for="model">Choose a model:</label>
                        <select id="model" name="model">
                            <option value="ANN">Artificial Neural Network (ANN)</option>
                            <option value="LSTM">Long Short-Term Memory (LSTM)</option>
                            <option value="GRU">Gated Recurrent Unit (GRU)</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn">
                        Classify Document
                    </button>
                </form>

                {% if message %}
                <div class="error-message">{{ message }}</div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
